<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าเว็บแรกของฉัน</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- 1. ส่วนหัวข้อ -->
    <h1>ยินดีต้อนรับสู่หน้าเว็บแรกของฉัน! 🎉</h1>
    
    <!-- 2. ส่วนข้อความ -->
    <p>นี่คือการเริ่มต้นเขียนโค้ด HTML บน VS Code โดยไม่ต้องติดตั้งภาษาเพิ่ม</p>

    <!-- 3. ส่วนรูปภาพ (ดึงรูปตัวอย่างจากอินเทอร์เน็ต) -->
    <img src="https://picsum.photos" alt="รูปภาพตัวอย่าง" style="border-radius: 8px; margin: 20px 0;"><br>

    <!-- 4. ส่วนปุ่มกด -->
    <button onclick="alert('ยินดีด้วย! โค้ดของคุณทำงานได้สำเร็จ')">คลิกที่นี่</button>

</body>
</html>
